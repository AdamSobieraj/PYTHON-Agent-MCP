# ==============================================================================
# EXPERIMENT CONFIGURATION (chapter 4, "Experiment plan")
# How to run:
#   python -m buissnes_agent.evaluation.run_experiments --exp all
#   python -m buissnes_agent.evaluation.run_experiments --exp E3
# ==============================================================================

# Research document catalog
# (target: ./dataset; until the dataset is delivered - inputs/)
dataset_path: "buissnes_agent/inputs"

# Research strategies (names from chapter 4)
strategies:
  - agentic
  - fixedSize
  - sentenceBased
  - semanticChunker

# Base parameters (E1, E2)
parameters:
  size: 600
  overlap: 100

# Threshold for a "too short" fragment (quality metric)
min_chunk_len: 50

# Pipeline parameters
batch_size: 50
force_refresh: true

# E3: parameter ablation grid (size x overlap)
e3:
  strategies:
    - fixedSize
    - sentenceBased
  size: [300, 600, 1000]
  overlap: [0, 50, 100]

# E4: robustness - simulated failures
e4:
  # llm_failure -> agentic strategy (fallback to sentence packing),
  # embedding_failure -> semanticChunker strategy (endpoint missing)
  faults:
    - llm_failure
    - embedding_failure
  fault_strategy_map:
    llm_failure: "agentic"
    embedding_failure: "semanticChunker"

# E5: retrieval A/B - dense (pure vector) vs hybrid (dense + sparse BM25, RRF)
# on ONE collection (ingested once, both arms query the same chunks).
# Requires Qdrant (QDRANT_API) - hybrid search runs inside the database.
e5:
  collection: e5_retrieval
  # chunking strategy for the E5 corpus (base parameters: size/overlap above)
  strategy: fixedSize
  # query set with ground truth (expected_sources = case-insensitive
  # substrings matched against the chunk payload's source fields)
  queries_file: config/e5_queries.json
  top_k: 10
  # how deep each leg (dense, sparse) fetches before the RRF fusion
  prefetch_limit: 50
  # true: re-ingest the collection + rebuild the BM25 index on every run
  rebuild: true
