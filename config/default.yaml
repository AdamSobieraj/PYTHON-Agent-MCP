# ==============================================================================
# MAIN APPLICATION CONFIGURATION
# ==============================================================================
app:
  name: "Business Agent Core"
  env: "default"
  # force_refresh option known from the Python code
  force_refresh: false

# ==============================================================================
# 1 & 4. DATA SOURCES (S3 / LOCAL)
# ==============================================================================
data_s3_source:
  input_path: "business"

data_source:
  # DATA_SOURCE=s3
  type: "local"

  # INPUT_DIRECTORY (local read path for the loader)
  local_input_path: "/home/blackmain/PycharmProjects/PYTHON-Agent-MCP/buissnes_agent/inputs"

# ==============================================================================
# 2 & 3. CHUNKING AND STRATEGIES
# ==============================================================================
chunking:
  # CHUNKING_MODULE=langchain
  module: "langchain"

  # Global parameters (Fallback)
  default_size: 600
  default_overlap: 100

  # ALLOWED_EXTENSIONS
  allowed_extensions:
    - ".md"
    - ".txt"
    - ".xml"
    - ".xsd"
    - ".pdf"
    - ".docx"
    - ".xlsx"
    - ".json"

  # Strategy configuration
  strategies:
    # =========================================================
    # Strategies for the LANGCHAIN module
    # =========================================================
    langchain:
      md:
        strategy: "sentenceBased"
        size: 1000
        overlap: 100
      txt:
        strategy: "sentenceBased"
        size: 1000
        overlap: 200
      xml:
        strategy: "sentenceBased"
        size: 600
        overlap: 50
      xsd:
        strategy: "sentenceBased"
        size: 600
        overlap: 50
      json:
        strategy: "sentenceBased"
        size: 500
        overlap: 0
      pdf:
        strategy: "sentenceBased"
        size: 1500
        overlap: 200
      docx:
        strategy: "sentenceBased"
        size: 1500
        overlap: 200
      xlsx:
        strategy: "fixedSize"
        size: 2000
        overlap: 0
      # Default fallback
      def:
        strategy: "sentenceBased"
        size: 2000
        overlap: 0

# ==============================================================================
# 5. VECTOR DATABASE (QDRANT)
# ==============================================================================
vector_db:
  # COLLECTION_NAME
  collection_name: "iso20022_remote_70b"
  # EMBEDDING_DIM (Logic belongs here for DB config)
  dimension: 768
