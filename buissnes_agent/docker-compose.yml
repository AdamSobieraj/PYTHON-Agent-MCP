services:
  # --- BAZA WEKTOROWA (QDRANT) ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"  # Port API HTTP
      - "6334:6334"  # Port gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- BAZA DANYCH METRYK (POSTGRESQL) ---
  postgres-metrics:
    image: postgres:15-alpine
    container_name: postgres_metrics
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rag_metrics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_metrics_password
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_metrics_data:/var/lib/postgresql/data
      # Schemat przy pierwszym starcie (pusty wolumen)
      - ./init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag_metrics"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --- INICJALIZACJA SCHEMATU METRYK (KAZDY start compose) ---
  # Jednorazowy serwis: po zdrowym Postgresie odpala DDL
  # (IF NOT EXISTS - idempotentne, dodaje nowe tabele do istniejacej bazy).
  init-metrics-db:
    image: postgres:15-alpine
    container_name: init_metrics_db
    depends_on:
      postgres-metrics:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres_metrics_password
    entrypoint: ["psql", "-h", "postgres-metrics", "-U", "postgres", "-d", "rag_metrics",
                 "-v", "ON_ERROR_STOP=1", "-f", "/init/01_metrics_schema.sql",
                 "-f", "/init/02_cost_metrics_schema.sql",
                 "-f", "/init/03_chunking_metrics_manual_schema.sql"]
    restart: "no"
    volumes:
      - ./init:/init:ro

  # --- OPCJONALNIE: PGADMIN (GUI dla PostgreSQL) ---
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    depends_on:
      - postgres-metrics

volumes:
  qdrant_storage:
    driver: local
  minio_data:
    driver: local
  postgres_metrics_data:
    driver: local
  pgadmin_data:
    driver: local

# Opcjonalnie: custom network
networks:
  default:
    name: rag_network
    driver: bridge